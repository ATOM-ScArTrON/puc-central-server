{% extends "base.html" %}{% block content %}<h1>Audit log</h1><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Result</th><th>Details</th></tr>{% for e in events %}<tr><td>{{ e.created_at }}</td><td>{{ e.actor }}</td><td>{{ e.action }}</td><td>{{ e.target_id or '' }}</td><td>{{ e.result }}</td><td>{{ e.details_json }}</td></tr>{% endfor %}</table>{% endblock %}
